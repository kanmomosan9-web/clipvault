<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipVault</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --bg:#0A1015; --surface:#131A22; --surface-2:#1A232D;
  --line:#22303C; --gold:#C8AA6E; --gold-dim:#6B5B3B;
  --teal:#0AC8B9; --text:#F0E6D2; --muted:#78899A;
  --cut:10px;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",
    "Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
  line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.cut-frame{position:relative;background:var(--gold-dim)}
.cut-frame>*{position:relative;z-index:1}
.cut-frame::after{content:"";position:absolute;inset:1px;background:var(--surface);
  clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px))}

header{flex:0 0 auto;display:flex;align-items:center;gap:20px;padding:0 22px;height:56px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0D141B,#0A1015)}
.mark{font-family:"Cinzel",serif;font-weight:600;font-size:18px;letter-spacing:.14em;
  color:var(--gold);white-space:nowrap;padding:4px 2px;transition:opacity .12s}
.mark:hover{opacity:.75}
.mark:active{opacity:.5}
.mark span{color:var(--text)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:34px;padding:0 12px 0 34px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--gold-dim)}
.search svg{position:absolute;left:11px;top:9px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--gold-dim);color:var(--text);font-weight:700;flex:0 0 auto}

main{flex:1;display:flex;min-height:0}
aside{flex:0 0 190px;border-right:1px solid var(--line);overflow-y:auto;padding:18px 0 40px;background:#0C131A}
.rail-h{font-size:10px;letter-spacing:.18em;color:var(--muted);padding:0 18px;margin:18px 0 8px}
.rail-h:first-child{margin-top:0}
.tag{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 18px;
  font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:.12s}
.tag:hover{color:var(--text);background:#10171E}
.tag[aria-pressed="true"]{color:var(--gold);border-left-color:var(--gold);background:#121A22}
.tag em{margin-left:auto;font-family:var(--mono);font-size:11px;font-style:normal;opacity:.6}
.stage{flex:1;overflow-y:auto;padding:22px 24px 60px}

/* ヘッダー直下に固定する。スクロールしても操作できるように */
.syncbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 22px;border-bottom:1px solid var(--gold-dim);
  background:#141A12;font-size:12.5px;
}
.syncbar.live{border-color:var(--teal);background:#0E1A1B}
.syncbar b{color:var(--gold);font-weight:500}
.syncbar.live b{color:var(--teal)}
.syncbar .who{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.syncbar button{
  padding:4px 12px;border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;
}
.syncbar button:hover{background:#1E1A12;border-color:var(--gold)}
.syncbar .spacer{margin-left:auto}
/* 追従中はホストの画面を映すだけにする。誤操作でずれないように */
body.following aside,
body.following .search,
body.following #sort,
body.following .stage .card,
body.following #more,
body.following .tagline,
body.following .reacts,
body.following .compose,
body.following .tabs{pointer-events:none;opacity:.55}
body.following .screen video::-webkit-media-controls{display:none}
body.following #syncbar{pointer-events:auto;opacity:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px}
.card{--cut:12px;display:block;text-align:left;width:100%;cursor:pointer}
.fav{
  position:absolute;right:6px;top:6px;width:28px;height:28px;display:grid;
  place-items:center;font-size:15px;line-height:1;color:#C9D3DC;
  background:rgba(5,8,11,.72);opacity:0;transition:.14s;
}
.card:hover .fav,.fav.on{opacity:1}
.fav:hover{color:var(--gold);background:rgba(5,8,11,.9)}
.fav.on{color:var(--gold)}
.favbtn{
  display:inline-flex;align-items:center;gap:7px;padding:3px 11px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:20px;
}
.favbtn:hover{border-color:var(--gold-dim)}
.favbtn[aria-pressed="true"]{border-color:var(--gold);background:#1E1A12;color:var(--gold)}
.rail-h.my{color:var(--gold)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);transition:.18s}
.card:hover .thumb{border-color:var(--gold);transform:translateY(-2px)}
.thumb i{position:absolute;inset:0;transition:transform .5s}
.card:hover .thumb i{transform:scale(1.06)}
.scan{position:absolute;inset:0;opacity:0;transition:opacity .18s;
  background:linear-gradient(180deg,transparent 55%,rgba(10,16,21,.92))}
.card:hover .scan{opacity:1}
.badge,.star{position:absolute;bottom:7px;padding:1px 6px;background:rgba(5,8,11,.86);font-family:var(--mono);font-size:11px}
.badge{right:7px}.star{left:7px;color:var(--gold)}
.said{position:absolute;left:0;right:0;bottom:26px;padding:0 9px;opacity:0;transform:translateY(4px);
  transition:.2s;font-size:12px;text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover .said{opacity:1;transform:none}
.meta{padding:9px 2px 0}
.title{font-size:14px;font-weight:500;line-height:1.4;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.chips{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:11px;color:var(--gold);border:1px solid var(--gold-dim);padding:0 6px;line-height:17px;white-space:nowrap}
.empty{padding:70px 10px;text-align:center;color:var(--muted)}
.more{display:block;width:100%;margin:26px 0 10px;padding:13px;font-size:12.5px;
  color:var(--muted);border:1px solid var(--line);background:var(--surface);letter-spacing:.06em}
.more:hover{color:var(--gold);border-color:var(--gold-dim)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px;font-weight:500}

.player{display:none}
.player.on{display:block}
/* グリッドの行の直下に展開する。一覧は消さず、スクロールも動かさない。 */
.player.inline{
  grid-column:1/-1;margin:4px 0 20px;padding:20px;
  border:1px solid var(--gold-dim);background:#0E151C;position:relative;
}
.player.inline::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:var(--gold);
}
.notch{
  position:absolute;top:-9px;width:16px;height:16px;background:#0E151C;
  border-left:1px solid var(--gold-dim);border-top:1px solid var(--gold-dim);
  transform:rotate(45deg);transition:left .18s;
}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:16px}
.card.open .thumb{border-color:var(--gold)}
.back:hover{color:var(--gold)}
.pwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;background:#05080B;border:1px solid var(--line);overflow:hidden}
.screen video{width:100%;height:100%;display:block;background:#05080B}
.mediaerr{
  margin-top:10px;padding:12px 14px;border-left:2px solid var(--danger,#C4433B);
  background:#17110F;font-size:12.5px;color:var(--muted);
}
.mediaerr b{display:block;color:var(--text);font-size:13.5px;margin-bottom:8px}
.mediaerr .kv{display:flex;gap:10px;margin:3px 0}
.mediaerr .kv span{flex:0 0 90px;color:var(--muted)}
.mediaerr code{font-family:var(--mono);font-size:11.5px;color:var(--gold);word-break:break-all}
.mediaerr p{margin-top:9px;font-size:11.5px}
.mediaerr p.lead{margin:0 0 10px;font-size:12.5px;color:var(--text);line-height:1.7}
.mediaerr p.lead b{display:inline;color:var(--gold);font-size:inherit}
.errbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.errbtns button,.errbtns a{
  padding:5px 13px;border:1px solid var(--gold-dim);color:var(--gold);
  font-size:12.5px;background:none;text-decoration:none;cursor:pointer;
}
.errbtns button:hover,.errbtns a:hover{background:#1E1A12;border-color:var(--gold)}
.errbtns button:disabled{opacity:.35;cursor:default}
.screen:empty::after{content:"読み込み中";position:absolute;inset:0;display:grid;
  place-items:center;color:var(--muted);font-size:12px}



.bar{height:6px;background:#151E27;position:relative;margin-top:2px;border:1px solid var(--line);border-top:none}

.marks{position:absolute;inset:0;pointer-events:none}
.marks u{position:absolute;width:2px;background:var(--teal);opacity:.8;top:0;height:100%}
.marks u.cmark{background:var(--text);opacity:.9;top:50%;height:50%}





.pinfo{margin-top:16px}
.prow a{color:var(--teal);text-decoration:none;font-size:12px}
.prow a:hover{color:var(--gold)}
.tchip.game{background:#1E1A12;border-color:var(--gold);color:var(--gold)}
.rx.dc{cursor:default;color:var(--gold)}
.cm-h .del{font-size:10.5px;color:var(--muted);margin-left:8px}
.cm-h .del:hover{color:#C4433B}
.cm-h span{margin-left:auto}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.said .tc{color:var(--teal);font-family:var(--mono)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.count b{color:var(--gold);font-weight:400}
#sort{height:30px;background:var(--surface);border:1px solid var(--line);
  color:var(--text);font-size:12.5px;padding:0 6px;outline:none}
#sort:focus{border-color:var(--gold-dim)}
.pinfo h1{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:10px}
.prow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);font-family:var(--mono)}

.reacts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;align-items:center}
.rxwrap{display:contents}
.rx{display:flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;transition:.12s;line-height:20px}
.rx:hover{border-color:var(--gold-dim)}
.rx b{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--muted)}
.rx[aria-pressed="true"]{border-color:var(--gold);background:#1E1A12}
.rx[aria-pressed="true"] b{color:var(--gold)}
.rx-add{color:var(--muted);padding:3px 10px;border:1px dashed var(--line);font-size:13px;line-height:20px}
.rx-add:hover{color:var(--gold);border-color:var(--gold-dim)}
.picker{display:none;gap:5px;margin-top:8px;flex-wrap:wrap}
.picker.on{display:flex}
.picker button{font-size:17px;padding:3px 7px;border:1px solid var(--line);background:var(--surface)}
.picker button:hover{border-color:var(--gold)}

.tagline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--gold);
  border:1px solid var(--gold-dim);padding:1px 7px;line-height:19px}
.tchip button{color:var(--gold-dim);font-size:13px;line-height:1;padding:0 1px}
.tchip button:hover{color:var(--text)}
.tadd{position:relative}
.tadd>button{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);padding:1px 9px;line-height:19px}
.tadd>button:hover{color:var(--gold);border-color:var(--gold-dim)}
.tbox{display:none;position:absolute;left:0;top:26px;z-index:5;width:210px;
  border:1px solid var(--gold-dim);background:var(--surface)}
.tbox.on{display:block}
.tbox input{width:100%;height:30px;padding:0 9px;background:var(--surface-2);border:none;
  border-bottom:1px solid var(--line);font-size:12.5px;outline:none}
.tbox .list{max-height:170px;overflow-y:auto}
.tbox .list button{display:flex;width:100%;gap:8px;padding:5px 9px;font-size:12.5px;text-align:left;color:var(--muted)}
.tbox .list button:hover{background:var(--surface-2);color:var(--text)}
.tbox .list button em{margin-left:auto;font-family:var(--mono);font-size:11px;font-style:normal;opacity:.6}
.tbox .list button.new{color:var(--teal)}

.rail{--cut:12px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 6px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tabs button b{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.7;margin-left:4px}
.pane{display:none;padding:12px 14px;max-height:56vh;overflow-y:auto}
.pane.on{display:block}
.line{display:flex;gap:10px;width:100%;text-align:left;padding:5px 7px;border-left:2px solid transparent;transition:.12s}
.line:hover{background:var(--surface-2)}
.line.now{background:var(--surface-2);border-left-color:var(--gold)}
.line time{font-family:var(--mono);font-size:11.5px;color:var(--teal);flex:0 0 auto;padding-top:1px}
.line.now time{color:var(--gold)}
.line p{font-size:13px;line-height:1.55}
mark{background:rgba(200,170,110,.24);color:var(--gold);padding:0 1px}

.cm{display:flex;gap:9px;padding:8px 4px;border-bottom:1px solid #182029}
.cm-b{min-width:0;flex:1}
.cm-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cm-h strong{font-size:12.5px;font-weight:500}
.cm-h .jump{font-family:var(--mono);font-size:11px;color:var(--teal)}
.cm-h .jump:hover{color:var(--gold)}
.cm-h span{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.cm-b p{font-size:13px;line-height:1.6;word-break:break-word}
.none{padding:18px 4px;color:var(--muted);font-size:12.5px}
.compose{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.compose textarea{width:100%;min-height:52px;resize:vertical;background:var(--surface-2);
  border:1px solid var(--line);padding:8px 9px;font-size:13px;outline:none;font-family:var(--sans)}
.compose textarea:focus{border-color:var(--gold-dim)}
.crow2{display:flex;align-items:center;gap:9px;margin-top:8px}
.stamp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.stamp input{accent-color:var(--gold)}
.stamp b{font-family:var(--mono);color:var(--teal);font-weight:400}
.send{margin-left:auto;padding:5px 14px;border:1px solid var(--gold-dim);color:var(--gold);font-size:12.5px}
.send:hover:not(:disabled){background:#1E1A12;border-color:var(--gold)}
.send:disabled{opacity:.4;cursor:default}
.hint{margin-top:12px;padding:9px 11px;border-left:2px solid var(--gold-dim);
  font-size:11.5px;color:var(--muted);background:#0F161D}
.sync{color:var(--teal)}

@media(max-width:900px){aside{display:none}.pwrap{grid-template-columns:1fr}.pane{max-height:340px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <button class="mark" id="home" title="一覧に戻る（すべての条件を解除）">CLIP<span>VAULT</span></button>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="タイトル・タグ・セリフ・コメントを検索" autocomplete="off">
  </div>
  <select id="sort" title="並び替え">
    <option value="new">新着順</option><option value="hot">人気順</option>
    <option value="old">古い順</option><option value="long">長い順</option>
    <option value="short">短い順</option>
  </select>
  <div class="count"><b id="n">0</b> / <span id="ntotal">0</span></div>
  <div class="me"><span class="av" id="avme">?</span><span id="who">…</span></div>
</header>

<div class="syncbar" id="syncbar" hidden></div>

<main>
  <aside>
    <div class="rail-h my">MY</div>
    <div id="myrail"></div>
    <div class="rail-h">GAME</div><div id="games"></div>
    <div class="rail-h">TAG</div><div id="tags"></div>
    <div class="rail-h">MEMBER</div><div id="members"></div>
  </aside>

  <div class="stage">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden><b>見つかりませんでした</b>別の言葉で探すか、左の絞り込みを解除してください。</div>
    <button id="more" class="more" hidden></button>

    <section id="player" class="player">
      <span class="notch" id="notch"></span>
      <button class="back" id="back">✕ 閉じる</button>
      <div class="pwrap">
        <div>
          <div class="screen" id="screen"></div>
          <div class="mediaerr" id="mediaerr" hidden></div>
          <div class="bar" id="barwrap"><div class="marks" id="marks"></div></div>

          <div class="pinfo">
            <h1 id="ptitle"></h1>
            <div class="prow"><span id="pmeta"></span><a id="jump" target="_blank" rel="noopener">Discord で開く ↗</a></div>
            <div class="tagline" id="tagline"></div>
            <div class="reacts">
              <button class="favbtn" id="favbtn"></button>
              <span class="rxwrap" id="reacts"></span>
            </div>
            <div class="picker" id="picker"></div>
          </div>
        </div>

        <div class="rail cut-frame">
          <div class="tabs">
            <button id="tab-t" aria-selected="true">文字起こし<b id="n-t"></b></button>
            <button id="tab-c" aria-selected="false">コメント<b id="n-c"></b></button>
          </div>
          <div class="pane on" id="pane-t">
            <div id="lines"></div>
            <div class="hint">行をクリックするとその瞬間から再生されます。</div>
          </div>
          <div class="pane" id="pane-c">
            <div id="cms"></div>
            <div class="compose">
              <textarea id="ctext" placeholder="コメントを書く" rows="2"></textarea>
              <div class="crow2">
                <label class="stamp"><input type="checkbox" id="cstamp" checked>時刻をつける <b id="cnow">0:00</b></label>
                <button class="send" id="csend" disabled>送信</button>
              </div>
              <div class="hint"><span class="sync">⇄</span> Discordのスレッドにも同じ内容が投稿されます。</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
window.__CLIENT_ID__ = "%%CLIENT_ID%%";
window.__CDN_PREFIX__ = "%%CDN_PREFIX%%";
const P = () => window.CV_PREFIX || "";
const AUTH = () => window.CV_TOKEN ? {"X-ClipVault-Token": window.CV_TOKEN} : {};
// <img> や <video> はカスタムヘッダーを送れないので、トークンはクエリで渡す。
// ブラウザ版は Cookie が効くため付かない。
const SIGN = u => window.CV_TOKEN
  ? u + (u.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(window.CV_TOKEN)
  : u;
const API={
  async get(u){const r=await fetch(P()+u,{credentials:"same-origin",headers:AUTH()});
    if(r.status===401)throw new Error("unauthorized");
    if(!r.ok)throw new Error(`GET ${P()+u} -> ${r.status}`);return r.json()},
  async send(m,u,b){const r=await fetch(P()+u,{method:m,credentials:"same-origin",
      headers:{"Content-Type":"application/json",...AUTH()},body:JSON.stringify(b||{})});
    if(!r.ok)throw new Error(`${m} ${P()+u} -> ${r.status}`);return r.json()},
};
const PALETTE=["🔥","😂","👏","😱","💀","🧠","🎯","❤️"];
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const hi=s=>{if(!query)return esc(s);
  const re=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return esc(s).replace(re,m=>`<mark>${m}</mark>`)};
const ago=iso=>{const d=(Date.now()-new Date(iso))/1000;
  if(d<60)return"たった今";if(d<3600)return`${Math.floor(d/60)}分前`;
  if(d<86400)return`${Math.floor(d/3600)}時間前`;
  if(d<2592000)return`${Math.floor(d/86400)}日前`;return iso.slice(0,10)};

let ME={name:"?"},query="",filters={game:null,tag:null,by:null},
    items=[],cur=null,vid=null,timer=null;
let offset=0,total=0,loading=false,done=false,io=null;
let onlyFav=false,favTotal=0;
const PAGE=36;

async function boot(){

async function facets(){

function drawMyRail(){

function qs(){
  const p=new URLSearchParams();

  p.set("limit",String(PAGE));p.set("offset",String(offset));

function reset(){
  const pl=$("player");
  if(pl.parentNode===$("grid"))document.querySelector(".stage").appendChild(pl);
  pl.classList.remove("on","inline");openId=null;cur=null;
  offset=0;done=false;items=[];cardEls.clear();$("grid").innerHTML="";
  if(io){io.disconnect();io=null}
  return load().catch(err);
}

function err(e){
  console.error("[clipvault]",e);
  $("empty").hidden=false;
  $("empty").innerHTML=`<b>読み込みに失敗しました</b>
    <span style="font-size:12px">${String(e&&e.message?e.message:e)}</span>`;
}

async function load(){
  if(loading||done)return;
  loading=true;$("more").hidden=false;$("more").textContent="読み込み中…";
  try{
    const d=await API.get("/api/clips?"+qs());
    total=d.total;
    d.items.forEach(c=>{items.push(c);$("grid").appendChild(cardFor(c))});
    offset+=d.items.length;
    done=!d.has_more;
    $("n").textContent=items.length;$("ntotal").textContent=total;
    pushNow();
    $("empty").hidden=items.length>0;
    $("more").hidden=items.length===0;
    if(done){
      $("more").textContent=`— 全 ${total} 件を表示しました —`;
      if(io){io.disconnect();io=null}
    }else{
      $("more").textContent="さらに読み込む";
      observe();
    }
  }finally{loading=false}
}

function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{
    if(es[0].isIntersecting&&!loading&&!done)load();
  },{root:document.querySelector(".stage"),rootMargin:"400px"});
  io.observe($("more"));
}

// Activity 内では外部ドメインへ直接アクセスできない（CSP）。
// 1) URL Mappings で cdn.discordapp.com に割り当てたプレフィックス経由
// 2) 失敗したら VM が中継する同一オリジンの経路
// 一度成功した方を覚えて以降はそちらを使う。
// URLに ?nofallback=1 を付けると中継へ切り替えず、CDN 経路の失敗をそのまま見せる。
// マッピングが効いているかを切り分けるため。
let mediaMode=null;   // null=未確定 / "cdn" / "stream"
const NO_FALLBACK=new URLSearchParams(location.search).get("nofallback")==="1";

function cdnSrc(c){
  if(!c.cdn)return null;
  try{const u=new URL(c.cdn);return window.__CDN_PREFIX__+u.pathname+u.search}
  catch(e){return null}
}
function streamSrc(c){
  return SIGN(P()+c.media+"?stream=1");
}

// 再生できないときの環境情報を集めてサーバーに送る。
// デスクトップ版 Discord は開発者ツールを開けないため、
// journalctl 側で読めるようにする。
async function reportMedia(vid,src,phase){
  const v=document.createElement("video");
  const codec=t=>{const r=v.canPlayType(t);return r||"no"};
  const detail={
    phase,
    src,
    errorCode:vid&&vid.error?vid.error.code:null,
    errorMessage:vid&&vid.error?vid.error.message:null,
    networkState:vid?vid.networkState:null,
    readyState:vid?vid.readyState:null,
    activity:!!window.CV_ACTIVITY,
    prefix:window.CV_PREFIX||"(なし)",
    ua:navigator.userAgent.slice(0,180),
    codecs:{
      mp4_h264_aac:codec('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'),
      mp4_generic:codec("video/mp4"),
      webm_vp9:codec('video/webm; codecs="vp9"'),
    },
  };
  try{
    const r=await fetch(src,{method:"GET",headers:{Range:"bytes=0-1"}});
    detail.probeStatus=r.status;
    detail.probeType=r.headers.get("Content-Type");
  }catch(e){detail.probeStatus="fetch失敗: "+e.message}

  console.error("[clipvault] 診断",detail);
  showMediaError(detail);
  try{
    await fetch(P()+"/api/log",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json",...AUTH()},
      body:JSON.stringify({tag:"media",detail})});
  }catch(e){/* 送れなくても画面には出ている */}
  return detail;
}

function showMediaError(d){
  const box=$("mediaerr");
  box.hidden=false;
  const decode=d.probeStatus===200||d.probeStatus===206;
  box.innerHTML=`<b>この環境では再生できませんでした</b>
    ${decode?`<p class="lead">動画は正しく届いています。<b>デスクトップ版 Discord の
      デコーダ</b>が初期化に失敗しました。設定 → 詳細設定 →
      <b>ハードウェアアクセラレーション</b>を切り替えると直ることがあります。</p>`:""}
    <div class="kv"><span>エラー</span><code>code ${d.errorCode??"-"}</code></div>
    <div class="kv"><span>取得</span><code>${d.probeStatus??"-"} ${d.probeType||""}</code></div>
    <div class="kv"><span>H.264/AAC</span><code>${d.codecs.mp4_h264_aac}</code></div>
    <div class="errbtns">
      <button id="err-jump">▶ Discord で再生</button>
      <button id="err-browser">🌐 ブラウザで開く</button>
      <a id="err-dl" download>⬇ ダウンロード</a>
    </div>
    <p>この内容はサーバーにも記録されました。</p>`;

  const open=url=>{
    if(window.CV_ACTIVITY&&window.__discordSdk){
      window.__discordSdk.commands.openExternalLink({url});
    }else{
      window.open(url,"_blank","noopener");
    }
  };
  $("err-jump").onclick=()=>open(cur.jump);
  const bu=ME.browser_url;
  const bb=$("err-browser");
  if(bu)bb.onclick=()=>open(bu);else bb.disabled=true;
  const dl=$("err-dl");
  dl.href=d.src;dl.setAttribute("download",(cur.title||"clip")+".mp4");
}
function mediaSrc(c){
  if(!window.CV_ACTIVITY)return SIGN(P()+c.media);
  if(mediaMode==="stream")return streamSrc(c);
  return cdnSrc(c)||streamSrc(c);
}

let openId=null;

function rowEndAfter(el){
  // 同じ行にあるカードのうち一番最後のものを返す。
  // その直後に差し込めば、行の途中でレイアウトが割れない。
  const top=el.offsetTop;
  let last=el;
  for(const c of $("grid").children){
    if(c.classList.contains("card")&&c.offsetTop===top)last=c;
  }
  return last;
}

function placePlayer(){
  const card=cardEls.get(openId);
  if(!card||!card.parentNode)return;
  const anchor=rowEndAfter(card);
  const pl=$("player");
  if(anchor.nextSibling!==pl)anchor.after(pl);
  const g=$("grid").getBoundingClientRect();
  const c=card.getBoundingClientRect();
  $("notch").style.left=(c.left-g.left+c.width/2-8)+"px";
}

async function openClip(id){
  if(syncRole==="follow"&&!applying)return;   // 追従中は操作させない
  cur=await API.get("/api/clips/"+id);
  openId=id;
  cardEls.forEach((el,k)=>el.classList.toggle("open",k===id));
  const pl=$("player");
  pl.classList.add("on","inline");
  placePlayer();
  $("ptitle").textContent=cur.title;
  $("pmeta").textContent=`${cur.by} · ${cur.date} · ${cur.width}x${cur.height} · ${mmss(cur.duration)}`;
  $("jump").href=cur.jump;
  $("jump").onclick=e=>{
    if(!window.CV_ACTIVITY)return;
    e.preventDefault();
    window.__discordSdk?.commands.openExternalLink({url:cur.jump});
  };
  const box=$("screen");box.innerHTML="";
  $("mediaerr").hidden=true;
  vid=document.createElement("video");
  vid.src=mediaSrc(cur);vid.poster=SIGN(P()+cur.thumb);vid.controls=true;vid.autoplay=true;
  console.log("[clipvault] media src =",vid.src);
  vid.playsInline=true;vid.preload="metadata";
  vid.ontimeupdate=sync;
  vid.onplay=pushNow;vid.onpause=pushNow;vid.onseeked=pushNow;
  vid.onloadedmetadata=()=>{
    if(window.CV_ACTIVITY&&mediaMode===null){
      mediaMode="cdn";console.log("[clipvault] media = cdn プロキシ経由");
    }
    drawMarks();
  };
  vid.onerror=()=>{
    const src=vid.currentSrc||vid.src;
    if(window.CV_ACTIVITY&&mediaMode!=="stream"&&!NO_FALLBACK){
      mediaMode="stream";
      console.warn("[clipvault] CDN プロキシに失敗。VM 中継へ切り替えます");
      vid.src=streamSrc(cur);vid.load();vid.play().catch(()=>{});
      return;
    }
    reportMedia(vid,src,mediaMode||"direct");   // 両方だめなら診断を送る
  };
  box.appendChild(vid);
  drawTags();drawReacts();drawFav();drawLines();drawComments();drawMarks();tab("t");
  if(syncRole==="follow")vid.controls=false;
  pushNow();                       // ホストなら開いたクリップを配る
  placePlayer();
  $("player").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function closeClip(){
  if(vid){vid.pause();vid.removeAttribute("src");vid.load();vid=null}
  pushNow();
  const card=cardEls.get(openId);
  refreshCard();                     // 編集内容をカードに反映
  const pl=$("player");
  pl.classList.remove("on","inline");
  document.querySelector(".stage").appendChild(pl);
  cardEls.forEach(el=>el.classList.remove("open"));
  facets();
  openId=null;cur=null;
  if(card&&card.parentNode)card.scrollIntoView({block:"nearest"});
}

function refreshCard(){
  if(!cur)return;
  const i=items.findIndex(x=>x.id===cur.id);
  if(i<0)return;
  Object.assign(items[i],{title:cur.title,tags:cur.tags,game:cur.game,
    stars:cur.stars,comments:cur.comments.length,favorited:cur.favorited});
  const old=cardEls.get(cur.id);
  if(old&&old.parentNode){
    const fresh=cardFor(items[i]);
    old.replaceWith(fresh);
    if(openId===cur.id)fresh.classList.add("open");
  }
}
const seek=t=>{if(!vid)return;vid.currentTime=t;vid.play().catch(()=>{})};

function drawMarks(){
  const d=(vid&&vid.duration)||cur.duration||1;
  $("marks").innerHTML=
    cur.segments.map(s=>`<u style="left:${s.start/d*100}%"></u>`).join("")+
    cur.comments.filter(c=>c.at!=null).map(c=>`<u class="cmark" style="left:${c.at/d*100}%"></u>`).join("");
}
async function saveTags(){
  const r=await API.send("PUT",`/api/clips/${cur.id}/tags`,{tags:cur.tags});
  cur.tags=r.tags.filter(t=>t!==cur.game);drawTags();facets();
}
function drawTags(){
  const h=$("tagline");h.innerHTML="";
  if(cur.game){const g=document.createElement("span");g.className="tchip game";
    g.textContent=cur.game;h.appendChild(g)}
  cur.tags.forEach(t=>{
    const s=document.createElement("span");s.className="tchip";
    s.innerHTML=`${esc(t)}<button title="外す">×</button>`;
    s.querySelector("button").onclick=()=>{cur.tags=cur.tags.filter(x=>x!==t);saveTags()};
    h.appendChild(s)});
  const w=document.createElement("span");w.className="tadd";
  w.innerHTML=`<button>＋ タグ</button><div class="tbox"><input placeholder="入力して選択"><div class="list"></div></div>`;

    const v=inp.value.trim();list.innerHTML="";
    (window.TAGS||[]).filter(o=>!cur.tags.includes(o.name)&&(!v||o.name.includes(v)))
      .slice(0,12).forEach(o=>{const b=document.createElement("button");
        b.innerHTML=`<span>${esc(o.name)}</span><em>${o.count}</em>`;

  btn.onclick=e=>{e.stopPropagation();if(box.classList.toggle("on")){fill();inp.focus()}};

function drawFav(){

function drawLines(){

function tab(k){
  $("tab-t").setAttribute("aria-selected",k==="t");

  $("pane-t").classList.toggle("on",k==="t");

function sync(){
  if(!vid)return;
  const t=vid.currentTime;$("cnow").textContent=mmss(t);
  let idx=-1;cur.segments.forEach((s,i)=>{if(t>=s.start)idx=i});
  const kids=[...$("lines").children];
  kids.forEach((el,i)=>el.classList&&el.classList.toggle("now",i===idx));
  if(kids[idx]&&$("pane-t").classList.contains("on"))
    kids[idx].scrollIntoView({block:"nearest",behavior:"smooth"});
}
// 読み込みに失敗して止まったときの復帰口も兼ねる。
// 絞り込み・検索・開いているクリップをすべて解除して読み直す。
async function goHome(){
  if(syncRole!=="off")await syncStop();
  if(vid){try{vid.pause()}catch(e){}}
  const pl=$("player");
  if(pl.parentNode===$("grid"))document.querySelector(".stage").appendChild(pl);
  pl.classList.remove("on","inline");
  openId=null;cur=null;vid=null;
  filters={game:null,tag:null,by:null};
  onlyFav=false;query="";$("q").value="";
  $("sort").value="new";
  loading=false;                 // 失敗して立ったままのフラグを解除
  $("mediaerr").hidden=true;
  $("empty").hidden=true;
  $("empty").innerHTML=`<b>見つかりませんでした</b>別の言葉で探すか、左の絞り込みを解除してください。`;
  document.querySelector(".stage").scrollTop=0;
  try{await facets()}catch(e){console.warn("[clipvault] facets 失敗",e)}
  reset();
}
// ---------------------------------------------------------------- 同時視聴
// ホストの画面をそのまま参加者に映す（Watch Together と同じ考え方）。
// 再生位置だけでなく、検索語・絞り込み・並び順・開いているクリップ・
// スクロール位置まで含めて共有し、参加者は操作しない。
const INSTANCE=new URLSearchParams(location.search).get("instance_id")||"";
let syncRole="off";     // off / host / follow
let syncState=null,syncTimer=null,watchTimer=null;
let lastSent="",applying=false,lastRev=-1;

const syncURL=p=>`/api/session/${encodeURIComponent(INSTANCE)}${p||""}`;
const stage=()=>document.querySelector(".stage");

function myView(){
  return {
    query,sort:$("sort").value,onlyFav,
    game:filters.game,tag:filters.tag,by:filters.by,
    loaded:items.length,
    openId,
    position:vid?Math.round(vid.currentTime*10)/10:0,
    playing:!!(vid&&!vid.paused&&!vid.ended),
    scroll:Math.round(stage().scrollTop),
  };
}

// 再生位置とスクロールは常に動くので、比較からは外して別扱いにする
function viewKey(v){
  return JSON.stringify([v.query,v.sort,v.onlyFav,v.game,v.tag,v.by,
                         v.loaded,v.openId]);
}

async function syncStart(asHost){
  if(!INSTANCE)return;
  try{
    if(asHost){
      const st=await API.send("POST",syncURL("/host"),{take:true});
      if(!st.is_host){alert(`${st.host_name} さんが共有中です`);return}
      syncRole="host";lastSent="";
    }else{
      syncRole="follow";lastRev=-1;
    }
  }catch(e){console.warn("[clipvault] sync 開始失敗",e);return}
  document.body.classList.toggle("following",syncRole==="follow");
  drawSync();
  clearInterval(syncTimer);
  if(syncRole==="host"){
    // ホストは定期的に生存を知らせる（沈黙すると解散するため）
    syncTimer=setInterval(syncTick,3000);
    syncTick();
  }else{
    syncTick().then(syncWatch);
  }
}

async function syncStop(){
  if(syncRole==="host"){
    try{await API.send("POST",syncURL("/host"),{take:false})}catch(e){}
  }
  syncRole="off";clearInterval(syncTimer);syncTimer=null;
  document.body.classList.remove("following");
  if(vid)vid.controls=true;
  drawSync();
}

async function syncTick(){
  try{
    if(syncRole==="host"){
      syncState=await API.send("POST",syncURL("/push"),{view:myView()});
      if(!syncState.is_host){syncRole="follow";document.body.classList.add("following")}
    }else{
      syncState=await API.get(syncURL());
      if(syncRole==="follow"){
        if(!syncState.host_id){          // ホストが共有をやめた／落ちた
          await syncStop();
          note("共有が終了しました");
          return;
        }
        await applyView(syncState);
      }
    }
  }catch(e){console.warn("[clipvault] sync 通信失敗",e)}
  drawSync();
}

// 参加者が待ち続ける。変化した瞬間に返るので追従が速い。
async function syncWatch(){
  while(syncRole==="follow"){
    try{
      const since=syncState?syncState.tick:0;
      syncState=await API.get(syncURL(`?since=${since}`));
      if(syncRole!=="follow")break;
      if(!syncState.host_id){
        await syncStop();note("共有が終了しました");break;
      }
      await applyView(syncState);
      drawSync();
    }catch(e){
      await new Promise(r=>setTimeout(r,2000));
    }
  }
}

function note(msg){
  const bar=$("syncbar");
  bar.hidden=false;bar.className="syncbar";
  bar.innerHTML=`<b>${esc(msg)}</b><span class="spacer"></span>`;
  setTimeout(drawSync,2500);
}

// ホストが操作したら即座に配る（一覧の変化・再生操作など）
let pushSoon=null;
function pushNow(){
  if(syncRole!=="host"||applying)return;
  clearTimeout(pushSoon);
  pushSoon=setTimeout(()=>{
    const k=viewKey(myView());
    if(k!==lastSent){lastSent=k;syncTick()}
  },200);
}

async function applyView(st){
  const v=st.view;
  if(!st.host_id||!v)return;
  applying=true;
  try{
    // 1) 一覧の条件が変わっていたら作り直す
    if(st.rev!==lastRev){
      lastRev=st.rev;
      const changed=query!==v.query||$("sort").value!==(v.sort||"new")
        ||onlyFav!==!!v.onlyFav||filters.game!==(v.game??null)
        ||filters.tag!==(v.tag??null)||filters.by!==(v.by??null);
      if(changed){
        query=v.query||"";$("q").value=query;
        $("sort").value=v.sort||"new";
        onlyFav=!!v.onlyFav;
        filters={game:v.game??null,tag:v.tag??null,by:v.by??null};
        await facets().catch(()=>{});
        await reset();
      }
      // ホストが読み込んだ件数まで追いつく
      let guard=0;
      while(items.length<(v.loaded||0)&&!done&&guard++<10)await load();

      // 2) 開いているクリップを合わせる
      if(v.openId&&openId!==v.openId)await openClip(v.openId);
      else if(!v.openId&&openId)closeClip();
    }

    // 3) 再生位置とスクロールは毎回追従する
    if(vid&&v.openId===openId){
      vid.controls=false;
      if(Math.abs(vid.currentTime-(v.position||0))>2)vid.currentTime=v.position||0;
      if(v.playing&&vid.paused)await vid.play().catch(()=>{});
      if(!v.playing&&!vid.paused)vid.pause();
    }
    if(typeof v.scroll==="number"&&Math.abs(stage().scrollTop-v.scroll)>60){
      stage().scrollTop=v.scroll;
    }
  }finally{applying=false}
}

function drawSync(){
  const bar=$("syncbar");
  if(!INSTANCE){bar.hidden=true;return}
  bar.hidden=false;
  const n=syncState?syncState.watchers.length:0;
  const host=syncState&&syncState.host_name;

  if(syncRole==="host"){
    bar.className="syncbar live";
    bar.innerHTML=`<span class="dot"></span><b>あなたの画面を共有中</b>
      <span class="who">${n} 人が参加</span>
      <span class="spacer"></span><button id="sync-off">共有をやめる</button>`;
    $("sync-off").onclick=syncStop;
  }else if(syncRole==="follow"){
    bar.className="syncbar live";
    bar.innerHTML=`<span class="dot"></span><b>${esc(host||"?")} の画面を見ています</b>
      <span class="who">操作はホストが行います・${n} 人が参加</span>
      <span class="spacer"></span><button id="sync-off">抜けて自分で操作</button>`;
    $("sync-off").onclick=syncStop;
  }else{
    bar.className="syncbar";
    bar.innerHTML=host
      ? `<b>${esc(host)} が画面を共有しています</b>
         <span class="who">${n} 人が参加</span>
         <span class="spacer"></span><button id="sync-join">一緒に見る</button>`
      : `<b>👥 みんなで見る</b>
         <span class="who">この通話の参加者に自分の画面を共有します</span>
         <span class="spacer"></span><button id="sync-join">共有を始める</button>`;
    const b=$("sync-join");
    if(b)b.onclick=()=>syncStart(!host);
  }
}

if(INSTANCE){
  drawSync();
  // 誰かが共有を始めたら待機中でも気づけるように
  watchTimer=setInterval(async()=>{
    if(syncRole!=="off")return;
    try{syncState=await API.get(syncURL());drawSync()}catch(e){}
  },4000);
  // ホストのスクロールも共有する
  stage().addEventListener("scroll",()=>{
    if(syncRole!=="host")return;
    clearTimeout(pushSoon);
    pushSoon=setTimeout(syncTick,300);
  },{passive:true});
}

$("home").onclick=goHome;

// 状態の外部公開。テストと不具合報告のためだけに使う。
window.__state=()=>({query,filters,onlyFav,openId,loading,done,offset,
  items:items.length,mediaMode,instance:INSTANCE,syncRole,syncState});

$("more").onclick=()=>{if(!done)load()};
$("back").onclick=closeClip;
$("tab-t").onclick=()=>tab("t");$("tab-c").onclick=()=>tab("c");
$("sort").onchange=reset;
$("ctext").oninput=e=>{$("csend").disabled=!e.target.value.trim()};
$("csend").onclick=async()=>{
  const v=$("ctext").value.trim();if(!v)return;
  $("csend").disabled=true;
  const at=$("cstamp").checked&&vid?Math.floor(vid.currentTime):null;
  const r=await API.send("POST",`/api/clips/${cur.id}/comments`,{body:v,at});
  cur.comments.push({id:r.id,user:ME.name,user_id:ME.id,at,body:v,
    created_at:new Date().toISOString()});
  cur.comments.sort((a,b)=>(a.at??1e9)-(b.at??1e9));
  $("ctext").value="";drawComments();drawMarks();
};
$("q").oninput=e=>{query=e.target.value.trim();clearTimeout(timer);
  timer=setTimeout(()=>{if($("player").classList.contains("on")){drawLines();drawComments()}
    else reset()},220)};
let rz=null;
window.addEventListener("resize",()=>{
  if(!openId)return;
  clearTimeout(rz);rz=setTimeout(placePlayer,120);
});
document.addEventListener("click",()=>
  document.querySelectorAll(".tbox.on,.picker.on").forEach(x=>x.classList.remove("on")));
document.addEventListener("keydown",e=>{
  const f=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==="Escape"&&openId)closeClip();
  if(e.key==="/"&&!f){e.preventDefault();$("q").focus()}
});
window.__start = boot;

</script>
<script type="module" src="assets/boot.js"></script>
